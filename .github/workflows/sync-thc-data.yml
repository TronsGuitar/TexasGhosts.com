name: Sync THC Data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_thc_data.py
      - name: Commit
        run: |
          [ -f data/community_ghosts.json ] || echo '[]' > data/community_ghosts.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/thc_markers.json data/community_ghosts.json
          git diff --cached --quiet || git commit -m "Sync THC data"
          git push origin HEAD:main
